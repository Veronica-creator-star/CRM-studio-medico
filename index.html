<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Simulator | Segreteria Studio Medico</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173047;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}header{background:#123d62;color:white;padding:19px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:22px;margin:0}header small{color:#c8e3f4}.shell{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 75px)}nav{background:#e7f0f7;padding:18px 12px;display:flex;flex-direction:column;gap:7px}nav button{background:transparent;border:0;text-align:left;padding:13px;border-radius:9px;font-size:15px;color:#173047;cursor:pointer}nav button.active,nav button:hover{background:#fff;color:#08659b;font-weight:700}main{padding:24px;max-width:1300px;width:100%;margin:auto}h2{margin:0 0 15px}h3{margin:10px 0}.card{background:white;border:1px solid #dce7ef;border-radius:13px;padding:18px;margin-bottom:15px;box-shadow:0 2px 7px #123d6209}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.stat{font-size:28px;font-weight:750;color:#0871ad}.muted{color:#647b8e;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:14px}button,.btn{background:#096d9f;border:1px solid #096d9f;color:#fff;border-radius:8px;padding:10px 13px;cursor:pointer;font:inherit}button.secondary{background:white;color:#096d9f}button.danger{background:#fff;color:#a43a40;border-color:#e4c5c8}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{font:inherit;padding:10px;border:1px solid #c8d8e3;border-radius:7px;background:#fff;width:100%;min-width:0}textarea{min-height:80px}label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.field{margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e5edf2;padding:10px 8px;vertical-align:top}th{color:#47687c;background:#f5f9fc}.scroll{overflow-x:auto}.tag{display:inline-block;border-radius:20px;padding:4px 8px;background:#e6f3fc;color:#175b81;font-size:12px}.alert{background:#fff4dd;border:1px solid #f0d69d;padding:12px;border-radius:9px;margin-bottom:16px;font-size:14px}.empty{padding:20px;color:#60788a;text-align:center}.slots{display:grid;grid-template-columns:80px 1fr 1fr;gap:5px;align-items:stretch}.slothead{font-weight:700;padding:10px;text-align:center;background:#dceef9;border-radius:7px}.time{padding:10px;color:#5d7182}.slot{border:1px solid #d8e6ee;background:#fff;border-radius:7px;padding:9px;text-align:left;min-height:65px;font-size:12px;color:#173047}.slot.busy{background:#e8f3fa;border-color:#9ec8de}.slot small{display:block;color:#567184}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 9px}.hidden{display:none!important}#toast{position:fixed;bottom:18px;right:18px;background:#173d58;color:white;padding:12px 18px;border-radius:9px;display:none;z-index:99}dialog{border:0;border-radius:14px;padding:0;max-width:850px;width:calc(100% - 24px);max-height:90vh;box-shadow:0 15px 60px #122d4555}dialog::backdrop{background:#0e293c88}.modalhead{padding:15px 20px;background:#e7f2f9;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:20px;overflow:auto;max-height:72vh}.modalhead button{padding:5px 10px}.printonly{display:none}@media(max-width:750px){.shell{display:block}nav{flex-direction:row;overflow:auto;position:sticky;top:0;z-index:5;padding:8px}nav button{white-space:nowrap;padding:9px}main{padding:14px}.two{grid-template-columns:1fr}header h1{font-size:18px}table{font-size:12px}}@media print{header,nav,.toolbar,.actions,button,.noprint,dialog{display:none!important}.shell{display:block}main{padding:0}.card{box-shadow:none}.printonly{display:block}body{background:white}}
</style></head><body><header><div><h1>✚ CRM Simulator · Studio Medico</h1><small>Laboratorio didattico · dati esclusivamente fittizi</small></div><span>MMG + Dermatologia</span></header><div class="shell"><nav id="nav"></nav><main id="app"></main></div><div id="toast"></div><dialog id="modal"><div class="modalhead"><strong id="modalTitle"></strong><button class="secondary" onclick="closeModal()">Chiudi ✕</button></div><div class="modalbody" id="modalBody"></div></dialog><script>
'use strict';const KEY='crm_studio_medico_sim_v1',DOCS=[{id:'mmg',name:'Dott. Marco Rossi',specialty:'Medicina generale'},{id:'derm',name:'Dott.ssa Laura Bianchi',specialty:'Dermatologia'}];const TYPES={mmg:['Visita generale','Visita di controllo','Consulto','Richiesta rinnovo ricetta'],derm:['Prima visita dermatologica','Visita di controllo dermatologico','Controllo nei','Consulto dermatologico']};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uid=()=>Math.random().toString(36).slice(2,10);const seed=()=>({patients:[{id:'P001',name:'Maria',surname:'Bianchi',dob:'1978-05-14',birthplace:'Roma',cf:'BNCMRA78E54H501X',sex:'F',phone:'3330000001',email:'maria.bianchi@example.com',residence:'Via Esempio 10, Roma',domicile:'',marital:'Coniugata',children:'2',emergency:'Paolo Bianchi – 3330000101',healthcard:'SIM-0001',doctor:'mmg',history:'Controlli periodici (dato fittizio)',allergies:'Nessuna riferita',conditions:'',medications:'',exemptions:'',notes:''},{id:'P002',name:'Luca',surname:'Verdi',dob:'1990-09-21',birthplace:'Viterbo',cf:'VRDLCU90P21M082Y',sex:'M',phone:'3330000002',email:'luca.verdi@example.com',residence:'Via Demo 22, Roma',doctor:'mmg',history:'Richiesta controlli periodici',allergies:'Lattosio (dato fittizio)',exemptions:'',notes:''},{id:'P003',name:'Giulia',surname:'Neri',dob:'2001-02-11',birthplace:'Roma',cf:'NREGLL01B51H501Z',sex:'F',phone:'3330000003',email:'giulia.neri@example.com',residence:'Via Scuola 5, Roma',doctor:'derm',history:'Visita dermatologica di controllo',allergies:'',exemptions:'',notes:''},{id:'P004',name:'Paolo',surname:'Conti',dob:'1965-11-03',birthplace:'Latina',cf:'CNTPLA65S03E472Q',sex:'M',phone:'3330000004',email:'paolo.conti@example.com',residence:'Via Laboratorio 8, Roma',doctor:'derm',history:'Controllo nei (simulazione)',allergies:'Nessuna riferita',exemptions:'',notes:''},{id:'P005',name:'Elena',surname:'Galli',dob:'1985-07-27',birthplace:'Roma',cf:'GLLLNE85L67H501R',sex:'F',phone:'3330000005',email:'elena.galli@example.com',residence:'Via Formazione 12, Roma',doctor:'mmg',history:'Prima registrazione in studio',allergies:'',exemptions:'',notes:''}],appointments:[],prescriptions:[],requests:[],payments:[],settings:{slot:30}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(db.patients))throw Error()}catch{db=seed()}let tab='dashboard',selectedPatient=null,agendaDay=today(),patientQuery='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{toast('Memoria del browser non disponibile: esporta i dati');return false}},toast=s=>{let el=$('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)},person=id=>db.patients.find(p=>p.id===id),full=p=>p?`${p.surname} ${p.name}`:'Paziente non trovato',doctor=id=>DOCS.find(d=>d.id===id)?.name||'—',formatDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('it-IT'):'—';const opts=(list,sel)=>list.map(([v,t])=>`<option value="${esc(v)}" ${String(sel)===String(v)?'selected':''}>${esc(t)}</option>`).join('');const patientOpts=sel=>opts([['','Seleziona paziente'],...db.patients.slice().sort((a,b)=>full(a).localeCompare(full(b))).map(p=>[p.id,full(p)])],sel);const docOpts=sel=>opts(DOCS.map(d=>[d.id,`${d.name} · ${d.specialty}`]),sel);const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;const selectField=(label,name,options,value)=>`<div class="field"><label>${label}</label><select name="${name}">${opts(options,value)}</select></div>`;const area=(label,name,value='')=>`<div class="field"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`;const buttons=(a)=>`<div class="actions">${a}</div>`;function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function submitData(form){return Object.fromEntries(new FormData(form).entries())}function nav(){let tabs=[['dashboard','⌂ Panoramica'],['patients','♙ Pazienti'],['agenda','▦ Agende'],['prescriptions','▤ Prescrizioni'],['requests','☏ Richieste'],['payments','€ Prestazioni e pagamenti'],['tools','⚙ Strumenti']];$('nav').innerHTML=tabs.map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}function go(t){tab=t;nav();render()}function render(){({dashboard,patients,agenda,prescriptions,requests,payments,tools})[tab]()}function dashboard(){let todays=db.appointments.filter(a=>a.date===today());$('app').innerHTML=`<h2>Panoramica dello studio</h2><div class="alert">SIMULATORE DIDATTICO: nessun collegamento al SSN, al Sistema Tessera Sanitaria o a sistemi fiscali. Non inserire dati di pazienti reali.</div><div class="grid"><div class="card"><div class="muted">Pazienti registrati</div><div class="stat">${db.patients.length}</div></div><div class="card"><div class="muted">Appuntamenti di oggi</div><div class="stat">${todays.length}</div></div><div class="card"><div class="muted">Richieste aperte</div><div class="stat">${db.requests.filter(r=>r.status!=='Completata').length}</div></div><div class="card"><div class="muted">Ricette simulate</div><div class="stat">${db.prescriptions.length}</div></div></div><div class="card"><h3>Azioni rapide</h3><div class="toolbar"><button onclick="patientForm()">+ Nuovo paziente</button><button onclick="appointmentForm()">+ Prenota visita</button><button onclick="prescriptionForm()">+ Richiesta ricetta</button><button onclick="requestForm()">+ Nuova richiesta</button></div></div><div class="card"><h3>Appuntamenti di oggi · ${formatDate(today())}</h3>${appointmentTable(todays)}</div><div class="card"><h3>I nostri medici</h3><div class="grid">${DOCS.map(d=>`<div><strong>${d.name}</strong><p class="muted">${d.specialty}</p></div>`).join('')}</div></div>`}
function patients(){let rows=db.patients.filter(p=>(full(p)+' '+(p.cf||'')+' '+(p.phone||'')).toLowerCase().includes(patientQuery.toLowerCase())).sort((a,b)=>full(a).localeCompare(full(b)));$('app').innerHTML=`<h2>Archivio pazienti</h2><div class="toolbar"><input aria-label="Cerca paziente" style="max-width:380px" placeholder="Cerca per nome, cognome, codice fiscale..." value="${esc(patientQuery)}" oninput="patientQuery=this.value;patients()"><button onclick="patientForm()">+ Nuovo paziente</button></div><div class="card scroll"><table><thead><tr><th>Codice</th><th>Paziente</th><th>Data nascita</th><th>Telefono</th><th>Medico</th><th>Azioni</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.id)}</td><td><strong>${esc(full(p))}</strong></td><td>${formatDate(p.dob)}</td><td>${esc(p.phone)}</td><td>${esc(doctor(p.doctor))}</td><td>${buttons(`<button onclick="patientView('${p.id}')">Scheda</button><button class="secondary" onclick="patientForm('${p.id}')">Modifica</button>`)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Nessun paziente trovato</div>'}</div>`}
function patientForm(id){let p=id?person(id):{},newP=!id;openModal(newP?'Nuovo paziente':'Modifica paziente',`<form id="patientForm" onsubmit="savePatient(event,'${id||''}')"><div class="two"><div>${field('Nome *','name',p.name,'text','required')}${field('Cognome *','surname',p.surname,'text','required')}${field('Data di nascita *','dob',p.dob,'date','required')}${field('Luogo di nascita','birthplace',p.birthplace)}${field('Codice fiscale (fittizio)','cf',p.cf,'text','maxlength="16"')}${selectField('Sesso anagrafico','sex',[['','Non specificato'],['F','F'],['M','M']],p.sex)}${field('Telefono','phone',p.phone,'tel')}${field('Email','email',p.email,'email')}${field('Residenza','residence',p.residence)}${field('Domicilio','domicile',p.domicile)}${selectField('Stato civile','marital',[['','Non specificato'],['Celibe/Nubile','Celibe/Nubile'],['Coniugato/a','Coniugato/a'],['Separato/a','Separato/a'],['Divorziato/a','Divorziato/a'],['Vedovo/a','Vedovo/a']],p.marital)}${field('Numero figli','children',p.children,'number','min="0"')}${field('Contatto di emergenza','emergency',p.emergency)}${field('Tessera sanitaria (solo codice fittizio)','healthcard',p.healthcard)}${selectField('Medico di riferimento','doctor',DOCS.map(d=>[d.id,d.name]),p.doctor||'mmg')}</div><div><h3>Informazioni del paziente</h3>${area('Storia del paziente (simulata)','history',p.history)}${area('Allergie e intolleranze','allergies',p.allergies)}${area('Patologie riferite','conditions',p.conditions)}${area('Farmaci abituali','medications',p.medications)}${area('Esenzioni: codice, descrizione, scadenza','exemptions',p.exemptions)}${area('Note amministrative','notes',p.notes)}</div></div><button type="submit">Salva paziente</button></form>`)}
function savePatient(e,id){e.preventDefault();let p=submitData(e.target),cf=p.cf.trim().toUpperCase();if(cf&&db.patients.some(x=>x.cf?.toUpperCase()===cf&&x.id!==id)){toast('Codice fiscale già presente');return}p.cf=cf;if(id){Object.assign(person(id),p)}else{p.id='P'+String(Math.max(0,...db.patients.map(x=>Number(x.id.slice(1))||0))+1).padStart(3,'0');db.patients.push(p)}save();closeModal();go('patients');toast('Scheda paziente salvata')}
function patientView(id){let p=person(id),apps=db.appointments.filter(a=>a.patientId===id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)),rx=db.prescriptions.filter(r=>r.patientId===id);openModal('Scheda paziente · '+full(p),`<div class="toolbar"><button onclick="patientForm('${id}')">Modifica scheda</button><button class="secondary" onclick="appointmentForm('${id}')">Prenota visita</button><button class="secondary" onclick="prescriptionForm('${id}')">Richiesta ricetta</button></div><div class="two"><div><h3>Dati personali</h3><p><strong>Codice:</strong> ${esc(p.id)}<br><strong>Nascita:</strong> ${formatDate(p.dob)} · ${esc(p.birthplace)}<br><strong>Codice fiscale:</strong> ${esc(p.cf)}<br><strong>Telefono:</strong> ${esc(p.phone)}<br><strong>Email:</strong> ${esc(p.email)}<br><strong>Residenza:</strong> ${esc(p.residence)}<br><strong>Domicilio:</strong> ${esc(p.domicile)}<br><strong>Stato civile:</strong> ${esc(p.marital)}<br><strong>Figli:</strong> ${esc(p.children)}<br><strong>Contatto emergenza:</strong> ${esc(p.emergency)}<br><strong>Tessera sanitaria:</strong> ${esc(p.healthcard)}<br><strong>Medico:</strong> ${esc(doctor(p.doctor))}</p></div><div><h3>Informazioni sanitarie simulate</h3>${[['Storia',p.history],['Allergie e intolleranze',p.allergies],['Patologie',p.conditions],['Farmaci abituali',p.medications],['Esenzioni',p.exemptions],['Note amministrative',p.notes]].map(([k,v])=>`<p><strong>${k}:</strong> ${esc(v||'—')}</p>`).join('')}</div></div><h3>Storico appuntamenti (${apps.length})</h3>${appointmentTable(apps)}<h3>Storico prescrizioni simulate (${rx.length})</h3>${rx.length?rx.map(r=>`<p>${formatDate(r.date)} · ${esc(r.drug)} · ${esc(r.status)} <button class="secondary" onclick="viewPrescription('${r.id}')">Apri</button></p>`).join(''):'<p class="muted">Nessuna prescrizione simulata</p>'}`)}
function appointmentTable(rows){return rows.length?`<div class="scroll"><table><thead><tr><th>Data e ora</th><th>Paziente</th><th>Medico</th><th>Prestazione</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>${rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td>${formatDate(a.date)} ${esc(a.time)}</td><td>${esc(full(person(a.patientId)))}</td><td>${esc(doctor(a.doctorId))}</td><td>${esc(a.type)}</td><td><span class="tag">${esc(a.status)}</span></td><td>${buttons(`<button class="secondary" onclick="appointmentForm(null,'${a.id}')">Modifica</button>`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nessun appuntamento</div>'}
function agenda(){let day=db.appointments.filter(a=>a.date===agendaDay);let slots=[];for(let h=8;h<19;h++)for(let m=0;m<60;m+=30)slots.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));$('app').innerHTML=`<h2>Agende dei due medici</h2><div class="toolbar"><label>Data <input type="date" value="${agendaDay}" onchange="agendaDay=this.value;agenda()"></label><button onclick="appointmentForm()">+ Nuovo appuntamento</button></div><div class="card"><p class="muted">Clicca su uno spazio libero per prenotare. Durata standard: 30 minuti; scegli 15, 30 o 60 minuti nel modulo. Gli appuntamenti sono verificati per evitare sovrapposizioni.</p><div class="slots"><div class="slothead">Orario</div>${DOCS.map(d=>`<div class="slothead">${esc(d.name)}<br><small>${esc(d.specialty)}</small></div>`).join('')}${slots.map(t=>`<div class="time">${t}</div>${DOCS.map(d=>{let start=t.split(':').reduce((a,b,i)=>a+(i?+b:60*+b),0);let a=day.find(a=>{if(a.doctorId!==d.id)return false;let x=a.time.split(':');let st=+x[0]*60+(+x[1]);return start>=st&&start<st+(+a.duration||30)});return a?`<button class="slot busy" onclick="appointmentForm(null,'${a.id}')"><strong>${esc(full(person(a.patientId)))}</strong><small>${esc(a.type)} · ${esc(a.status)}</small></button>`:`<button class="slot" onclick="appointmentForm(null,null,'${d.id}','${t}')">+ Libero</button>`}).join('')}`).join('')}</div></div><div class="card"><h3>Elenco appuntamenti · ${formatDate(agendaDay)}</h3>${appointmentTable(day)}</div>`}
function appointmentForm(patientId,appointmentId,docId,time){let a=appointmentId?db.appointments.find(x=>x.id===appointmentId):{},doc=docId||a.doctorId||'mmg';openModal(appointmentId?'Modifica appuntamento':'Nuovo appuntamento',`<form onsubmit="saveAppointment(event,'${appointmentId||''}')">${selectField('Paziente *','patientId',[['','Seleziona paziente'],...db.patients.map(p=>[p.id,full(p)])],patientId||a.patientId)}${selectField('Medico','doctorId',DOCS.map(d=>[d.id,d.name]),doc)}<div class="two">${field('Data *','date',a.date||agendaDay,'date','required')}${field('Ora *','time',a.time||time||'09:00','time','required')}</div>${selectField('Durata (minuti)','duration',[[15,'15'],[30,'30'],[60,'60']],a.duration||30)}<div class="field"><label>Prestazione</label><select name="type" id="visitType"></select></div>${selectField('Stato','status',['Prenotato','Confermato','Arrivato / in attesa','Effettuato','Annullato','Assente'].map(s=>[s,s]),a.status||'Prenotato')}${area('Note organizzative','notes',a.notes)}<div class="toolbar"><button>Salva appuntamento</button>${appointmentId?`<button type="button" class="danger" onclick="deleteAppointment('${appointmentId}')">Elimina appuntamento</button>`:''}</div></form>`);let form=$('modalBody').querySelector('form');const update=()=>{let d=form.elements.doctorId.value,prev=form.elements.type.value;form.elements.type.innerHTML=opts(TYPES[d].map(x=>[x,x]),prev||a.type||TYPES[d][0])};form.elements.doctorId.addEventListener('change',update);update();if(a.type)form.elements.type.value=a.type}
function saveAppointment(e,id){e.preventDefault();let a=submitData(e.target);if(!a.patientId){toast('Seleziona un paziente');return}let st=mins(a.time),end=st+Number(a.duration);let clash=db.appointments.some(x=>x.id!==id&&x.doctorId===a.doctorId&&x.date===a.date&&x.status!=='Annullato'&&a.status!=='Annullato'&&st<mins(x.time)+Number(x.duration||30)&&end>mins(x.time));if(clash){toast('Orario occupato: scegli un altro intervallo');return}if(id)Object.assign(db.appointments.find(x=>x.id===id),a);else db.appointments.push({id:uid(),...a});agendaDay=a.date;save();closeModal();go('agenda');toast('Appuntamento salvato')}function mins(t){let [h,m]=t.split(':').map(Number);return h*60+m}function deleteAppointment(id){if(!confirm('Eliminare questo appuntamento?'))return;db.appointments=db.appointments.filter(a=>a.id!==id);save();closeModal();render()}
function prescriptions(){let rows=db.prescriptions.slice().reverse();$('app').innerHTML=`<h2>Prescrizioni simulate</h2><div class="alert">La segreteria registra una richiesta o prepara una bozza. La decisione terapeutica e la validazione sono esclusivamente del medico. Tutti i documenti sono fac-simile NON VALIDI.</div><div class="toolbar"><button onclick="prescriptionForm()">+ Nuova richiesta di prescrizione</button></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Paziente</th><th>Medico</th><th>Tipo</th><th>Farmaco (simulato)</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${formatDate(r.date)}</td><td>${esc(full(person(r.patientId)))}</td><td>${esc(doctor(r.doctorId))}</td><td>${esc(r.kind)}</td><td>${esc(r.drug)}</td><td>${esc(r.status)}</td><td><button class="secondary" onclick="viewPrescription('${r.id}')">Apri</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Nessuna richiesta registrata</div>'}</div>`}
function prescriptionForm(patientId){openModal('Richiesta / bozza prescrizione simulata',`<form onsubmit="savePrescription(event)">${selectField('Paziente *','patientId',[['','Seleziona paziente'],...db.patients.map(p=>[p.id,full(p)])],patientId)}${selectField('Medico','doctorId',DOCS.map(d=>[d.id,d.name]),'mmg')}${selectField('Tipo documento','kind',[['Ricetta bianca','Ricetta bianca'],['Promemoria ricetta SSN (simulato)','Promemoria ricetta SSN (simulato)']],'Ricetta bianca')}<div class="two">${field('Data','date',today(),'date','required')}${field('Medicinale richiesto (fittizio) *','drug','','text','required')}${field('Dosaggio indicato dal medico','dose')}${field('Confezioni','quantity','1','number','min="1" max="20"')}</div>${area('Indicazioni / note (simulate)','notes')}${selectField('Stato','status',[['Richiesta ricevuta','Richiesta ricevuta'],['In valutazione al medico','In valutazione al medico'],['Validata dal medico (simulazione)','Validata dal medico (simulazione)']],'Richiesta ricevuta')}<button>Salva richiesta</button></form>`)}function savePrescription(e){e.preventDefault();let r=submitData(e.target);if(!r.patientId){toast('Seleziona un paziente');return}db.prescriptions.push({id:uid(),...r});save();closeModal();go('prescriptions');toast('Richiesta salvata')}
function viewPrescription(id){let r=db.prescriptions.find(x=>x.id===id),p=person(r.patientId);openModal('Fac-simile prescrizione',`<div id="rxPrint" style="border:2px solid #b5cbd8;padding:22px"><h2>FAC-SIMILE DIDATTICO · NON VALIDO</h2><p><strong>${esc(r.kind)}</strong></p><p>Codice simulazione: SIM-${esc(r.id.toUpperCase())}<br>Data: ${formatDate(r.date)}<br>Medico: ${esc(doctor(r.doctorId))}<br>Paziente: ${esc(full(p))} · Nascita: ${formatDate(p?.dob)}</p><hr><p>Farmaco (dato fittizio): <strong>${esc(r.drug)}</strong><br>Dosaggio: ${esc(r.dose)}<br>Confezioni: ${esc(r.quantity)}<br>Indicazioni: ${esc(r.notes)}</p><p>Stato: ${esc(r.status)}</p><p><strong>Documento di esercitazione, non utilizzabile in farmacia e non trasmesso al SSN.</strong></p></div><div class="toolbar" style="margin-top:12px"><button onclick="printPrescription('${id}')">Stampa fac-simile</button><select id="rxStatus" style="max-width:300px">${opts(['Richiesta ricevuta','In valutazione al medico','Validata dal medico (simulazione)'].map(x=>[x,x]),r.status)}</select><button class="secondary" onclick="updateRx('${id}')">Aggiorna stato</button></div>`)}function updateRx(id){db.prescriptions.find(r=>r.id===id).status=$('rxStatus').value;save();viewPrescription(id);toast('Stato aggiornato')}function printPrescription(id){let html=$('rxPrint').outerHTML,w=window.open('','_blank');if(!w){toast('Consenti le finestre popup per stampare');return}w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Fac-simile didattico</title><style>body{font-family:Arial;padding:35px;line-height:1.6}#rxPrint{border:2px solid #888;padding:25px}</style></head><body>'+html+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}
function requests(){$('app').innerHTML=`<h2>Richieste dei pazienti</h2><div class="toolbar"><button onclick="requestForm()">+ Registra richiesta</button></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Paziente</th><th>Tipo</th><th>Medico</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>${db.requests.slice().reverse().map(r=>`<tr><td>${formatDate(r.date)}</td><td>${esc(full(person(r.patientId)))}</td><td>${esc(r.type)}</td><td>${esc(doctor(r.doctorId))}</td><td>${esc(r.status)}</td><td><button class="secondary" onclick="requestForm('${r.id}')">Apri / modifica</button></td></tr>`).join('')}</tbody></table>${db.requests.length?'':'<div class="empty">Nessuna richiesta registrata</div>'}</div>`}function requestForm(id){let r=id?db.requests.find(x=>x.id===id):{};openModal(id?'Modifica richiesta':'Nuova richiesta',`<form onsubmit="saveRequest(event,'${id||''}')">${selectField('Paziente *','patientId',[['','Seleziona paziente'],...db.patients.map(p=>[p.id,full(p)])],r.patientId)}${selectField('Medico','doctorId',DOCS.map(d=>[d.id,d.name]),r.doctorId||'mmg')}${field('Data','date',r.date||today(),'date','required')}${selectField('Tipo di richiesta','type',['Rinnovo ricetta','Informazioni','Appuntamento','Richiamare il paziente','Altro'].map(x=>[x,x]),r.type||'Rinnovo ricetta')}${area('Descrizione','notes',r.notes)}${selectField('Stato','status',['Ricevuta','Inoltrata al medico','Completata'].map(x=>[x,x]),r.status||'Ricevuta')}<button>Salva richiesta</button></form>`)}function saveRequest(e,id){e.preventDefault();let r=submitData(e.target);if(!r.patientId){toast('Seleziona un paziente');return}if(id)Object.assign(db.requests.find(x=>x.id===id),r);else db.requests.push({id:uid(),...r});save();closeModal();go('requests')}
function payments(){$('app').innerHTML=`<h2>Prestazioni e pagamenti</h2><div class="alert">Registro amministrativo semplificato, senza fatture, IVA, calcoli fiscali o trasmissioni telematiche. Per le prestazioni del MMG distinguere attività SSN ed eventuali prestazioni private.</div><div class="toolbar"><button onclick="paymentForm()">+ Registra prestazione</button></div><div class="card scroll"><table><thead><tr><th>Data</th><th>Paziente</th><th>Medico</th><th>Prestazione</th><th>Importo</th><th>Pagamento</th><th>Stato</th><th>Azioni</th></tr></thead><tbody>${db.payments.slice().reverse().map(p=>`<tr><td>${formatDate(p.date)}</td><td>${esc(full(person(p.patientId)))}</td><td>${esc(doctor(p.doctorId))}</td><td>${esc(p.type)}</td><td>€ ${esc(p.amount)}</td><td>${esc(p.method)}</td><td>${esc(p.status)}</td><td><button class="secondary" onclick="paymentForm('${p.id}')">Modifica</button></td></tr>`).join('')}</tbody></table>${db.payments.length?'':'<div class="empty">Nessuna prestazione registrata</div>'}</div>`}function paymentForm(id){let p=id?db.payments.find(x=>x.id===id):{};openModal('Prestazione e pagamento',`<form onsubmit="savePayment(event,'${id||''}')">${selectField('Paziente *','patientId',[['','Seleziona paziente'],...db.patients.map(x=>[x.id,full(x)])],p.patientId)}${selectField('Medico','doctorId',DOCS.map(d=>[d.id,d.name]),p.doctorId||'derm')}${field('Data','date',p.date||today(),'date','required')}${field('Prestazione','type',p.type||'Visita dermatologica')}${field('Importo in euro (stabilito dallo studio)','amount',p.amount||'0','number','min="0" step="0.01"')}${selectField('Modalità','method',['Non previsto (SSN)','POS','Contanti','Bonifico'].map(x=>[x,x]),p.method||'POS')}${selectField('Stato','status',['Da pagare','Pagato','Non dovuto'].map(x=>[x,x]),p.status||'Da pagare')}${area('Note','notes',p.notes)}<button>Salva prestazione</button></form>`)}function savePayment(e,id){e.preventDefault();let p=submitData(e.target);if(!p.patientId){toast('Seleziona un paziente');return}if(id)Object.assign(db.payments.find(x=>x.id===id),p);else db.payments.push({id:uid(),...p});save();closeModal();go('payments')}
function tools(){$('app').innerHTML=`<h2>Strumenti e salvataggio</h2><div class="card"><h3>Salvataggio locale</h3><p>I dati sono conservati solo in questo browser e dispositivo. Non sono sincronizzati. Usa sempre dati inventati e non inserire dati sanitari reali.</p><div class="toolbar"><button onclick="exportData()">Esporta esercitazione (JSON)</button><label class="btn" style="cursor:pointer">Importa esercitazione <input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none"></label></div></div><div class="card"><h3>Ripristino</h3><p>Ripristina i cinque pazienti iniziali ed elimina le esercitazioni salvate in questo browser.</p><button class="danger" onclick="resetData()">Ripristina dati iniziali</button></div><div class="card"><h3>Informazioni</h3><p>Versione 1.0 · Simulatore didattico indipendente · Nessun accesso a SSN, FSE, Sistema Tessera Sanitaria, ricettazione reale o servizi fiscali.</p></div>`}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='crm-esercitazione-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function importData(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(rd.result);if(!Array.isArray(d.patients)||!Array.isArray(d.appointments)||!Array.isArray(d.prescriptions)||!Array.isArray(d.requests)||!Array.isArray(d.payments))throw Error('Formato non valido');if(!confirm('Sostituire tutti i dati correnti con quelli importati?'))return;db=d;save();go('dashboard');toast('Esercitazione importata')}catch{toast('File non valido')}};rd.readAsText(f)}function resetData(){if(!confirm('Eliminare tutti i dati inseriti e ripristinare i cinque pazienti iniziali?'))return;db=seed();save();go('dashboard');toast('Dati iniziali ripristinati')}save();go('dashboard');
</script></body></html>
